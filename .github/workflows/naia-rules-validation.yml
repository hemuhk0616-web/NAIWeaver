name: NAIA Rules Validation

on:
  push:
    branches: [master]
    paths:
      - 'lib/core/services/naia_*.dart'
      - 'test/core/services/naia_rules_regression_test.dart'
      - '.github/workflows/naia-rules-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  naia-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze NAIA rule engine and validator
        run: flutter analyze lib/core/services/naia_rule_validator.dart lib/core/services/naia_ordered_rule_engine.dart lib/core/services/naia_conditional_processor.dart lib/core/services/naia_character_actions.dart test/core/services/naia_rules_regression_test.dart

      - name: Run NAIA regression tests
        run: flutter test test/core/services/naia_rules_regression_test.dart
