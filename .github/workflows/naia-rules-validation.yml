name: NAIA Rules Validation

on:
  push:
    branches: [master, 'test/naia-v10-validation']
    paths:
      - 'lib/core/services/naia_*.dart'
      - 'lib/core/services/zip_unicode_entry_names.dart'
      - 'test/zip_unicode_entry_names_test.dart'
      - 'test/core/services/naia_rules_regression_test.dart'
      - 'test/naia_*_test.dart'
      - 'lib/features/generation/providers/generation_notifier.dart'
      - 'lib/features/generation/widgets/settings_panel.dart'
      - 'lib/main.dart'
      - '.github/workflows/naia-rules-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  naia-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze NAIA rule engine and validator
        run: flutter analyze lib/core/services/naia_rule_validator.dart lib/core/services/naia_ordered_rule_engine.dart lib/core/services/naia_conditional_processor.dart lib/core/services/naia_character_actions.dart test/core/services/naia_rules_regression_test.dart

      - name: Analyze complete Flutter project
        run: flutter analyze

      - name: Run NAIA service and regression tests
        run: flutter test test/core/services/naia_rules_regression_test.dart test/naia_character_actions_test.dart test/naia_conditional_processor_test.dart test/naia_interaction_remapper_test.dart test/naia_preview_sample_selection_test.dart test/naia_preview_render_inputs_test.dart test/naia_ordered_rule_engine_test.dart test/naia_prompt_pipeline_test.dart test/naia_resolution_directive_test.dart test/naia_rule_validator_test.dart test/zip_unicode_entry_names_test.dart
