name: Android Test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-test-apk:
    if: github.ref == 'refs/heads/test/naia-v10-validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Flutter source
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test
      # Store the same debug keystore as an encrypted repository secret.
      # Without it, every hosted runner would generate a different signing key.
      - name: Restore stable Android signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Set ANDROID_DEBUG_KEYSTORE_BASE64 in repository Actions secrets before building. This prevents accidental key rotation."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey > /dev/null
      - name: Build Android debug APK
        run: flutter build apk --debug --build-number ${{ github.run_number }}
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NAIWeaver-Android-test-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
