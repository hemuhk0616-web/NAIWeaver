name: Android Test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-test-apk:
    if: github.ref == 'refs/heads/test/naia-v10-validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout selected test branch
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NAIWeaver-Android-test-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
